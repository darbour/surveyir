name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --python ${{ matrix.python-version }}
      - run: uv run ruff check src tests scripts examples
      - run: uv run ruff format --check src tests scripts examples
      - run: uv run pyright
      - run: uv run pytest -q
      - name: JSON Schema is up to date
        run: |
          uv run surveyir schema -o schema/surveyir.schema.json
          git diff --exit-code schema

  corpus:
    # Loader + column-naming checks over ~860 public QSFs and ~2,000 export headers.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - uses: actions/cache@v4
        with:
          path: |
            corpus/external
            corpus/external_columns
          key: corpus-${{ hashFiles('corpus/manifest.json') }}
      - run: uv run python scripts/fetch_corpus.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: uv run pytest -q tests/test_external_corpus.py tests/test_external_columns.py
