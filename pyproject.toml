[project]
name = "surveyir"
version = "0.1.0"
description = "A lossless intermediate representation for survey instruments, with a full-fidelity Qualtrics (.qsf) loader and pluggable exporters."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "David Arbour", email = "darbour26@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
]
keywords = ["qualtrics", "qsf", "survey", "questionnaire", "simulation", "llm", "social-science"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]

[project.scripts]
surveyir = "surveyir.cli:main"

[project.entry-points."surveyir.exporters"]
json = "surveyir.exporters.json:JsonExporter"
markdown = "surveyir.exporters.markdown:MarkdownExporter"
codebook = "surveyir.exporters.codebook:CodebookExporter"

[project.entry-points."surveyir.loaders"]
qualtrics = "surveyir.loaders.qualtrics:QualtricsLoader"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pyright>=1.1.380",
]

[build-system]
requires = ["uv_build>=0.8.23,<0.9.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.10"
include = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]
